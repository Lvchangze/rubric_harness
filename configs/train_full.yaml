# Rubric generation over the whole RaR train split, on GLM-5.3.
#
# This is a full re-run, not a continuation, and it is the third generator model
# this run has used. The history matters for reading the artefacts on disk:
#
#   runs/train_full_glm52  glm5.2, retired mid-run on 2026-09-17.
#                          baseline complete (28,720), agentic-tools partial (5,381).
#   runs/train_full_kimi   Kimi-K3, an interim choice after glm5.2 died.
#                          baseline partial (8,321), stopped when GLM-5.3 was picked.
#   runs/train_full_glm53  this run.
#
# None of the three may be merged. `baseline` earns its place as a control only
# by holding the generator model fixed against `agentic-tools`, which is true
# within a model and false across two, so baseline is regenerated here even
# though a complete glm5.2 copy already exists. Each output row now carries a
# `model` field (harness/pipeline.py) so a mixed file is detectable rather than
# merely improbable.
#
# Per-question call counts carry over from `runs/tools_v1` (a property of the
# pipeline, not the model); wall-clock does not, since it depends on this
# endpoint's latency and capacity:
#
#   baseline        1 LLM call/question    ~29k calls
#   agentic-tools   78 LLM calls/question  ~2.2M calls
#                   (20.3 tool calls/question on top, all model-backed;
#                    no web tools — those are opt-in and not in DEFAULT_TOOLS)
#
# The cache key includes the model name (harness/llm.py), so nothing generated
# under glm5.2 or Kimi is reachable from this run — expect a cold cache.
#
# Both stages resume by uid from whatever is already on disk, so an interrupted
# run costs only the questions that had not finished. Every finished call is in
# the content-addressed cache, so a rerun of a completed question is free.
run_name: train_full_glm53
runs_dir: runs
results_dir: results

generators:
  - baseline
  - agentic-tools

llm:
  model: GLM-5.3-H20-t1
  # Measured on this endpoint rather than inherited — concurrency does not
  # transfer between deployments, and too high a setting degrades throughput
  # without erroring. `scripts/probe_endpoint.py`, 2026-09-17:
  #
  #   conc  32   5.80 rps   p50  7.7s   64/64 ok
  #   conc  64   7.47 rps   p50 12.3s   128/128 ok
  #   conc 128  11.65 rps   p50 15.7s   256/256 ok
  #   conc 256  12.05 rps   p50 24.5s   512/512 ok
  #
  # Clean at every level (unlike Kimi, which threw stream errors at 256), but
  # throughput is flat past 128 while latency keeps climbing: 2x the concurrency
  # buys 3% more work. 128 is the knee, so both stages run there.
  concurrency: 128
  reasoning_effort: high
  # Left at 16384, and the reason is worth recording because the obvious
  # "improvement" here is a trap. Empty replies (reasoning trace eats the budget,
  # no visible content) cost a full call plus an escalated retry, 255 of them in
  # four hours, so raising the cap looks free — a cap is not a target. It is not
  # free: under `reasoning_effort: high` the model *does* spend the extra room.
  # Raising this to 24576 alongside rollout_max_tokens turned a 1.5% empty-reply
  # rate into a 41% timeout rate and cut throughput 5x. Budgets here trade
  # against latency, not just against truncation.
  max_tokens: 16384
  max_attempts: 4
  cache_dir: runs/cache
  # Left at 1200 for the same reason. Tightening it to 600 does not make stuck
  # calls finish, it reclassifies slow-but-legitimate ones as failures and pays
  # for them again on retry: this endpoint decodes at roughly 41 tok/s, so a
  # full-budget generation needs ~400s and a 600s ceiling sits right on top of
  # the legitimate tail.
  request_timeout_s: 1200

sample:
  domains: [rar_science, rar_medicine]
  split: train
  # Larger than either split; `sample_examples` takes everything that passes.
  n_per_domain: 20000
  seed: 1234

  # Keep the duplicate filter: 1,883 train questions repeat verbatim, and
  # generating for both spends the budget twice for one object.
  deduplicate_questions: true

  # Upper bounds lifted to cover the corpus (longest question 10,975 chars,
  # longest reference 10,251). The shipped defaults of 6,000/12,000 exist so a
  # judging prompt fits; generation has no such limit and dropping 900+
  # questions for it would be discarding work for a constraint that does not
  # apply here.
  max_question_chars: 12000
  max_reference_chars: 14000

  # Lower bounds kept, and they are doing real work: 4,677 train rows carry a
  # reference answer under 40 characters, the shortest being a single
  # character. A rubric derived from those is not short, it is noise.
  min_question_chars: 80
  min_reference_chars: 40
  min_rubric_items: 4

agentic:
  n_rollouts: 3
  enable_decompose: true
  enable_rollouts: true
  enable_reconcile: true
  enable_pitfalls: true
  enable_critic: true
  enable_calibration: true
  # 12000, measured against the alternative rather than assumed. Rollouts are
  # the slowest and most numerous stage, and they dominate both failure modes,
  # so this number decides the run's throughput more than any other.
  #
  # At 12000 they produce ~15% empty replies (trace exhausts the budget) and
  # 47 timeouts per four hours. Raising it to 24576 to fix that backfired
  # badly: a full-budget generation then needs ~600s at this endpoint's ~41
  # tok/s, rollouts took 200 of 456 timeouts in 43 minutes, and end-to-end
  # throughput fell 5x. The empty replies are the cheaper failure — they cost
  # one call, whereas a timeout costs the full ceiling and then retries.
  rollout_max_tokens: 12000
  drop_gold_failures: true
  demote_indiscriminate: true
  target_min_items: 6
  target_max_items: 16
  max_pitfall_fraction: 0.25

  # `agentic-tools` forces this on; the eight default tools, no web access.
  enable_tools: true
  tool_max_rounds: 8
  tool_max_parallel: 4
  tool_timeout_s: 120.0
  sandbox_timeout_s: 20.0
  tool_corpus_limit: 4000

eval:
  # Generation only. Nothing here is scored: this run exists to produce rubrics
  # for downstream RL, and the quality question was already settled on the
  # evaluation runs (see HANDOFF.md §2).
  metrics: []
